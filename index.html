<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, initial-scale=1" />
<title>Home</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #1b2430; color: #fff;
    font-family: "SamsungOne", "Helvetica Neue", Arial, sans-serif; }
  .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; opacity: 0;
    transition: opacity 2s ease; }
  .bg.on { opacity: 1; }
  .bg.zoom { animation: drift 40s linear forwards; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.1); } }
  #shade { position: absolute; left: 0; top: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.45) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,.75) 100%); }
  #top { position: absolute; top: 44px; right: 68px; display: flex; align-items: center; gap: 36px;
    font-size: 34px; font-weight: 500; text-shadow: 0 2px 12px rgba(0,0,0,.5);
    padding: 10px 18px; border-radius: 16px; border: 3px solid transparent; transition: background .2s; }
  #top.sel { border-color: rgba(255,255,255,.9); background: rgba(0,0,0,.4); }
  #weather { display: flex; align-items: center; gap: 12px; }
  #weather svg { width: 40px; height: 40px; }
  #date { position: absolute; top: 108px; right: 80px; font-size: 22px; color: rgba(255,255,255,.8);
    text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  #wxcue { position: absolute; top: 150px; right: 80px; font-size: 19px; color: rgba(255,255,255,.75);
    text-shadow: 0 2px 10px rgba(0,0,0,.6); opacity: 0; transition: opacity .2s; }
  #wxcue.on { opacity: 1; }
  #forecast { position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8,10,14,.97); display: none; padding: 90px 96px; }
  #forecast.on { display: block; }
  #forecast h1 { margin: 0 0 6px; font-size: 44px; font-weight: 600; }
  #forecast .sub { margin: 0 0 48px; font-size: 24px; color: rgba(255,255,255,.6); }
  #fdays { display: flex; gap: 24px; }
  .fday { flex: 1; background: rgba(255,255,255,.06); border-radius: 22px; padding: 32px 10px; text-align: center; }
  .fday.today { background: rgba(255,255,255,.14); }
  .fday .dname { font-size: 26px; font-weight: 500; margin-bottom: 20px; }
  .fday svg { width: 76px; height: 76px; margin: 0 auto 20px; display: block; }
  .fday .hi { font-size: 40px; font-weight: 600; }
  .fday .lo { font-size: 28px; color: rgba(255,255,255,.55); margin-top: 4px; }
  .fday .desc { font-size: 19px; color: rgba(255,255,255,.7); margin-top: 16px; min-height: 46px; }
  #title { position: absolute; left: 96px; bottom: 360px; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  #title .k { font-size: 26px; color: rgba(255,255,255,.75); margin-bottom: 8px; }
  #title .t { font-size: 72px; font-weight: 600; letter-spacing: -1px; }

  /* tvOS-style dock: rounded app tiles, focused tile lifts, name below */
  #title { display: none; }
  #dock { position: absolute; left: 0; right: 0; bottom: 96px; height: 330px; padding: 0 110px; overflow: hidden; }
  #track { position: relative; height: 100%; display: flex; align-items: center; transition: transform .3s ease; }
  .app { position: relative; flex: 0 0 320px; height: 192px; margin-right: 46px; border-radius: 24px;
    background: rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 28px rgba(0,0,0,.35); transform: scale(1); transition: transform .22s ease, box-shadow .22s ease; }
  .app.focus { transform: scale(1.14) translateY(-14px); box-shadow: 0 34px 60px rgba(0,0,0,.6); z-index: 2; }
  .app.focus::before { content: ""; position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 24px; z-index: 3;
    background: linear-gradient(160deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 45%); }
  .app img.orig { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 24px; }
  .app img.logo { filter: drop-shadow(0 4px 14px rgba(0,0,0,.55)); }
  .app svg.glyph { width: 96px; height: 96px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round;
    stroke-linejoin: round; }
  .app .mono { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 54px; font-weight: 600; background: rgba(255,255,255,.18); }
  .app .mono svg { width: 54px; height: 54px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; }
  .app .name { position: absolute; left: -40px; right: -40px; top: 100%; margin-top: 18px; text-align: center;
    font-size: 26px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); opacity: 0; transition: opacity .2s; }
  .app.focus .name { opacity: 1; }
  .app .brand { position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 24px; display: flex;
    align-items: center; justify-content: center; }
  .app .brand svg { width: 104px; height: 104px; }
  .app.mod { background: linear-gradient(135deg, #e62117, #9b0d07); }
  #hint { position: absolute; right: 96px; bottom: 24px; font-size: 18px; color: rgba(255,255,255,.55); }
  #hint b { display: inline-block; width: 14px; height: 14px; border-radius: 3px; background: #e5484d;
    margin: 0 6px -1px 0; }
  #toast { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); background: rgba(0,0,0,.7);
    padding: 16px 32px; border-radius: 16px; font-size: 24px; opacity: 0; transition: opacity .3s; }
  #toast.on { opacity: 1; }
  #toast { z-index: 10; }
  #testhint { display: none; position: absolute; left: 96px; bottom: 24px; font-size: 18px; color: rgba(255,255,255,.55); }
  .laptop #testhint { display: block; }
  #picker { position: absolute; inset: 0; background: rgba(8,8,10,.92); display: none; padding: 80px 96px; overflow: hidden; }
  #picker.on { display: block; }
  #picker h1 { margin: 0 0 8px; font-size: 48px; font-weight: 600; }
  #picker p { margin: 0 0 40px; font-size: 24px; color: rgba(255,255,255,.65); }
  #opts { display: flex; gap: 28px; margin: 28px 0 36px; }
  .opt { position: relative; min-width: 520px; height: 110px; border-radius: 18px; background: rgba(255,255,255,.08);
    border: 3px solid transparent; padding: 16px 26px; display: flex; flex-direction: column; justify-content: center; }
  .opt .ol { font-size: 20px; color: rgba(255,255,255,.6); margin-bottom: 4px; }
  .opt b { font-size: 28px; font-weight: 600; }
  .opt.focus { border-color: #fff; background: rgba(255,255,255,.18); }
  .opt input { display: none; font: inherit; font-size: 28px; color: #fff; background: rgba(0,0,0,.35);
    border: 2px solid rgba(255,255,255,.6); border-radius: 10px; padding: 6px 12px; width: 460px; outline: none; }
  .opt.editing b { display: none; }
  .opt.editing input { display: block; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 28px; max-height: 560px; overflow: hidden; }
  .pi { height: 110px; border-radius: 18px; background: rgba(255,255,255,.08); display: flex; align-items: center;
    gap: 18px; padding: 0 22px; font-size: 24px; border: 3px solid transparent; }
  .pi .no { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex: 0 0 44px; }
  .pi.sel .no { background: #fff; color: #000; border-color: #fff; font-weight: 600; }
  .pi .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pi.focus { border-color: #fff; background: rgba(255,255,255,.18); }
  #diag { position: absolute; inset: 0; background: rgba(8,8,10,.94); display: none; padding: 70px 96px;
    font: 22px/1.5 Menlo, Consolas, monospace; white-space: pre-wrap; overflow: hidden; }
  #diag.on { display: block; }
</style>
</head>
<body>
  <img class="bg" id="bg0" alt="">
  <img class="bg" id="bg1" alt="">
  <div id="shade"></div>
  <div id="top"><div id="weather"></div><div id="clock"></div></div>
  <div id="date"></div>
  <div id="wxcue">OK: dự báo 5 ngày ▾</div>
  <div id="forecast"></div>
  <div id="title"><div class="k" id="kick"></div><div class="t" id="name"></div></div>
  <div id="dock"><div id="track"></div></div>
  <div id="hint"><b></b>Nút đỏ: ứng dụng và cài đặt</div>
  <div id="testhint">Thử trên máy tính: kéo ảnh biểu tượng vào đây hoặc dán (Ctrl+V)</div>
  <div id="toast"></div>
  <div id="picker">
    <h1>Cài đặt</h1>
    <div id="opts">
      <div class="opt" id="opt0"><span class="ol">Biểu tượng (OK để đổi)</span><b id="stylename"></b></div>
      <div class="opt" id="opt1"><span class="ol">Thành phố xem thời tiết (OK để đổi)</span><b id="cityname"></b>
        <input id="cityinput" type="text" autocomplete="off" placeholder="VD: Đà Lạt · để trống = tự động"></div>
    </div>
    <p>Ứng dụng: bấm OK để thêm hoặc bỏ. Thứ tự trên màn hình chính theo thứ tự anh chọn. Nút đỏ hoặc Back để lưu.</p>
    <div id="grid"></div>
  </div>
  <div id="diag"></div>
<script>
// ---- settings you can change ----
// Weather location is found automatically from the internet connection.
// To force a city, set e.g. FIXED_CITY = { name: "Đà Lạt", lat: 11.9404, lon: 108.4583 };
var FIXED_CITY = null;
var FALLBACK_CITY = { name: "TP. Hồ Chí Minh", lat: 10.7769, lon: 106.7009 };
var PHOTO_SECONDS = 30;
// "white" = white logos, "color" = logos in their own colours, "original" = icons as the TV has them (with the box)
var DEFAULT_ICON_STYLE = "original";
var DEFAULT_APPS = [/tizentube/i, /youtube/i, /netflix/i, /spotify/i, /geforce/i, /\bzn\b/i];
// ---------------------------------

var BRIDGE = "http://127.0.0.1:47812";
var ICON_SERVER = BRIDGE + "/icon?path=";
var bridgeOK = false, modWs = null;
var hasTizen = typeof window.tizen !== "undefined" && !!tizen.application;

var allApps = [], pinned = [], items = [];
var focus = 0, mode = "dock", pfocus = 0, pzone = "grid", ofocus = 0, bgFlip = 0, topFocus = false;
var iconState = {};

function $(id) { return document.getElementById(id); }
function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove("on"); }, 2500); }

// ---------- apps ----------
function xget(path, cb) {
  var x = new XMLHttpRequest(), fin = false;
  function end(ok, txt) { if (fin) return; fin = true; cb(ok, txt); }
  x.onreadystatechange = function () { if (x.readyState === 4) end(x.status === 200, x.responseText); };
  x.onerror = function () { end(false); };
  x.timeout = 8000; x.ontimeout = function () { end(false); };
  try { x.open("GET", BRIDGE + path, true); x.send(); } catch (e) { end(false); }
}
function bridgeApps(tries, cb) {
  xget("/apps", function (ok, txt) {
    var list = null;
    if (ok) { try { list = JSON.parse(txt); } catch (e) {} }
    if (list) { bridgeOK = true; cb(list); return; }
    if (tries > 1) setTimeout(function () { bridgeApps(tries - 1, cb); }, 1000); else cb([]);
  });
}
function tbModules(cb) {
  var fin = false, asked = 0;
  function end(list) { if (fin) return; fin = true; cb(list || []); }
  setTimeout(function () { end([]); }, 6000);
  try {
    modWs = new WebSocket("ws://127.0.0.1:8081");
    modWs.onopen = function () { asked++; modWs.send(JSON.stringify({ type: 4, payload: false })); };
    modWs.onmessage = function (e) {
      var d; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.type !== 4) return;
      if (!d.payload && asked < 2) { asked++; modWs.send(JSON.stringify({ type: 4, payload: true })); return; }
      end((d.payload || []).filter(function (m) {
        return m && m.appPath && !/fhvn|framehome/i.test(m.fullName || "") && m.appName !== "Home";
      }).map(function (m) { return { id: "mod:" + m.fullName, name: m.appName || m.name, mod: m }; }));
    };
    modWs.onerror = function () { end([]); };
  } catch (e) { end([]); }
}
function loadApps(cb) {
  xget("/disarm?home=" + encodeURIComponent(location.href), function () {});
  if (!hasTizen) {
    var apps = [], mods = [], left = 2;
    var done = function () {
      if (--left) return;
      var all = apps.concat(mods);
      if (all.length) { cb(all); return; }
      document.documentElement.className += " laptop";
      demoApps(cb);
    };
    toast("Đang tải ứng dụng…");
    bridgeApps(15, function (l) { apps = l; done(); });
    tbModules(function (l) { mods = l; done(); });
    return;
  }
  appsFromTizen(cb);
}
function demoApps(cb) {
  {
    cb([
      { id: "a.TizenTube", name: "TizenTube" }, { id: "org.tizen.netflix-app", name: "Netflix" },
      { id: "b.GeForceNOW", name: "GeForce NOW" }, { id: "c.ZN", name: "ZN" },
      { id: "d.Spotify", name: "Spotify" }, { id: "e.PrimeVideo", name: "Prime Video" },
      { id: "f.Disney", name: "Disney+" }, { id: "g.Browser", name: "Internet" }, { id: "h.Plex", name: "Plex" }
    ]);
    return;
  }
}
function appsFromTizen(cb) {
  try {
    tizen.application.getAppsInfo(function (list) {
      var seen = {};
      var out = list.filter(function (a) {
        if (!a.show || !a.name || seen[a.id]) return false;
        if (/homescreen|launcher/i.test(a.id)) return false;
        seen[a.id] = 1; return true;
      }).map(function (a) { return { id: a.id, name: a.name, icon: a.iconPath }; });
      out.sort(function (x, y) { return x.name.localeCompare(y.name); });
      cb(out);
    }, function () { cb([]); });
  } catch (e) { cb([]); }
}
function appById(id) { for (var i = 0; i < allApps.length; i++) if (allApps[i].id === id) return allApps[i]; return null; }
function savePinned() { try { localStorage.setItem("hvn.pinned", JSON.stringify(pinned)); } catch (e) {} }
function loadPinned() {
  try { var s = JSON.parse(localStorage.getItem("hvn.pinned") || "null"); if (s && s.length) return s; } catch (e) {}
  var ids = [];
  DEFAULT_APPS.forEach(function (re) {
    for (var i = 0; i < allApps.length; i++) {
      if (re.test(allApps[i].name) && ids.indexOf(allApps[i].id) < 0) { ids.push(allApps[i].id); break; }
    }
  });
  if (!ids.length) ids = allApps.slice(0, 5).map(function (a) { return a.id; });
  return ids;
}

// ---------- icons ----------
// Real icons come from the TV itself (through the small helper in service.js).
// Most TV app icons are a logo on a coloured box. To show "only the icon", the box colour
// is detected and removed, so just the logo floats on the photo (white, or in its own colours).
// If an icon can't be cleaned up (photo backgrounds etc.) a simple drawn symbol is shown instead.
var STYLES = ["white", "color", "original"];
var STYLE_NAMES = { white: "logo trắng", color: "logo màu gốc", original: "biểu tượng gốc (có khung)" };
var iconStyle = (function () { try { var v = localStorage.getItem("hvn.iconStyle"); if (STYLES.indexOf(v) >= 0) return v; } catch (e) {} return DEFAULT_ICON_STYLE; })();

var GLYPHS = {
  film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  play: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l5.5-3.5z"/>',
  game: '<path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.9 3.2L2 14.5a2.6 2.6 0 0 0 4.6 2.1L8 15h8l1.4 1.6a2.6 2.6 0 0 0 4.6-2.1l-.8-6.3A4 4 0 0 0 17.3 5z"/>',
  ball: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.4 4.4H9.6l-1.4-4.4z"/><path d="M12 3v4.5M15.8 10.3l4.4-1.6M14.4 14.7l2.6 3.8M9.6 14.7L7 18.5M8.2 10.3L3.8 8.7"/>',
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9M12 3c-2.5 2.6-3.8 5.6-3.8 9s1.3 6.4 3.8 9"/>',
  tv: '<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 3l4 3 4-3M8 21h8"/>',
  pc: '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>'
};
var GLYPH_RULES = [
  [/pc on tv|remote access|screen mirroring|smart view/i, "pc"],
  [/netflix|prime|disney|hbo|max\b|apple tv|rakuten|cinema|movie|film|mubi|ertflix|vodafone tv|cosmote tv|nova go/i, "film"],
  [/youtube|tube|twitch|vimeo|plex|jellyfin|kodi|video/i, "play"],
  [/geforce|xbox|game|steam|luna|playstation|boosteroid/i, "game"],
  [/\bzn\b|sport|dazn|football|uefa|fifa|nba|\bf1\b|eurosport/i, "ball"],
  [/spotify|music|deezer|tidal|radio|podcast|soundcloud/i, "music"],
  [/internet|browser|web/i, "globe"],
  [/\btv\b|live|iptv|channel/i, "tv"]
];
function fallbackHtml(app) {
  if (app.add) return '<div class="mono"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>';
  for (var i = 0; i < GLYPH_RULES.length; i++) {
    if (GLYPH_RULES[i][0].test(app.name)) return '<svg class="glyph" viewBox="0 0 24 24">' + GLYPHS[GLYPH_RULES[i][1]] + "</svg>";
  }
  var ini = app.name.replace(/[^A-Za-z0-9À-ỹ]/g, "").slice(0, 1).toUpperCase() || "?";
  return '<div class="mono">' + ini + "</div>";
}

// Fit bg = a + b*x + c*y (one channel) to the border samples, so plain and gradient boxes both work.
function fitPlane(pts, ch) {
  var n = 0, sx = 0, sy = 0, sxx = 0, syy = 0, sxy = 0, sv = 0, sxv = 0, syv = 0;
  for (var i = 0; i < pts.length; i++) {
    var p = pts[i], v = p[2 + ch];
    n++; sx += p[0]; sy += p[1]; sxx += p[0] * p[0]; syy += p[1] * p[1]; sxy += p[0] * p[1];
    sv += v; sxv += p[0] * v; syv += p[1] * v;
  }
  var A = [[n, sx, sy], [sx, sxx, sxy], [sy, sxy, syy]], B = [sv, sxv, syv];
  for (var c = 0; c < 3; c++) {
    var m = c;
    for (var r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
    var t = A[c]; A[c] = A[m]; A[m] = t; var tb = B[c]; B[c] = B[m]; B[m] = tb;
    if (Math.abs(A[c][c]) < 1e-9) return [sv / n, 0, 0];
    for (var r2 = c + 1; r2 < 3; r2++) {
      var f = A[r2][c] / A[c][c];
      for (var k = c; k < 3; k++) A[r2][k] -= f * A[c][k];
      B[r2] -= f * B[c];
    }
  }
  var X = [0, 0, 0];
  for (var r3 = 2; r3 >= 0; r3--) {
    var acc = B[r3];
    for (var k2 = r3 + 1; k2 < 3; k2++) acc -= A[r3][k2] * X[k2];
    X[r3] = acc / A[r3][r3];
  }
  return X;
}

// If the picture has a frame around the icon (e.g. a loose screenshot or photo crop), find the icon inside it.
// Each side is checked on its own, a few times, so uneven frames (dark bar on one side, gap on another) work too.
function findTrim(img) {
  var W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
  var sc = Math.min(1, 240 / Math.max(W, H)), w = Math.max(8, Math.round(W * sc)), h = Math.max(8, Math.round(H * sc));
  var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  var cx = cv.getContext("2d"); cx.drawImage(img, 0, 0, w, h);
  var d; try { d = cx.getImageData(0, 0, w, h).data; } catch (e) { return { x: 0, y: 0, w: W, h: H, frames: [] }; }
  function px(x, y) { var k = (y * w + x) * 4; return [d[k], d[k + 1], d[k + 2], d[k + 3]]; }
  function near(a, b, t) { return Math.abs(a[0] - b[0]) < t && Math.abs(a[1] - b[1]) < t && Math.abs(a[2] - b[2]) < t && Math.abs(a[3] - b[3]) < t; }
  function mean(arr) { var m = [0, 0, 0, 0]; for (var i = 0; i < arr.length; i++) for (var c = 0; c < 4; c++) m[c] += arr[i][c] / arr.length; return m; }
  function share(arr, ref, t) { var n = 0; for (var i = 0; i < arr.length; i++) if (near(arr[i], ref, t)) n++; return n / arr.length; }
  var x0 = 0, y0 = 0, x1 = w - 1, y1 = h - 1, frames = [];
  function line(side, s) { // s-th line in from a side, inside the current box
    var out = [], i;

// ---------- dock ----------
function buildDock() {
  items = pinned.map(appById).filter(Boolean);
  items.push({ id: "__add", name: "Thêm", add: true });
  if (focus >= items.length) focus = items.length - 1;
  var dock = $("track"); dock.innerHTML = "";
  items.forEach(function (app) {
    var d = document.createElement("div");
    d.className = "app" + (app.mod ? " mod" : "");
    d.setAttribute("data-id", app.id);
    d.innerHTML = iconHtml(app) + nameHtml(app);
    dock.appendChild(d);
    if (!app.add && !brandOf(app)) loadIcon(app);

  setFocus(focus);

var scrollX = 0;
function setFocus(i) {

  }
  toast("Đang tìm: " + q + "…");
  fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=vi&format=json&name=" + encodeURIComponent(q))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var r0 = j.results && j.results[0];
      if (!r0) { toast("Không tìm thấy: " + q); return; }
      var city = { name: r0.name, lat: r0.latitude, lon: r0.longitude };
      try { localStorage.setItem("hvn.city", JSON.stringify(city)); } catch (e) {}
      toast("Thành phố: " + city.name + (r0.country ? ", " + r0.country : ""));
      loadWeather(); renderPicker();
    })
    .catch(function () { toast("Không có mạng để tìm kiếm"); });
}

// ---------- check screen (green button) ----------
function openDiag() {
  mode = "diag";
  var box = $("diag");
  box.classList.add("on");
  function render(helper) {
    var lines = ["Kiểm tra (nút xanh lá hoặc Back để đóng)", "",
      "TV API: " + (hasTizen ? "có" : "không"),
      "Số ứng dụng tìm thấy: " + allApps.length,
      "Trợ giúp biểu tượng: " + helper,
      "Kiểu biểu tượng: " + STYLE_NAMES[iconStyle],
      "Thời tiết tại: " + (currentCity ? currentCity.name + (savedCity() ? " (đã chọn)" : " (tự động)") : "-"), ""];
    items.forEach(function (a) {
      if (a.add) return;
      var st = iconState[a.id] || {};
      var shown = st.status !== "ok" ? "[ký hiệu]  " : iconStyle === "original" ? "[gốc]      " :
        (st.proc && st.proc[iconStyle]) ? "[logo]     " : "[ký hiệu]  ";
      var why = st.status === "loading" ? "đang tải" : st.status !== "ok" ? "không tải được" :
        (iconStyle !== "original" && !(st.proc && st.proc[iconStyle])) ? "đã tải, nhưng chưa xóa được nền" : "ok (" + st.via + ")";
      lines.push(shown + a.name + "  ·  " + a.id + "  ·  " + why);
      lines.push("            " + (a.icon || "(không có đường dẫn biểu tượng)"));
    });
    box.textContent = lines.join("\n");
  }
  render("đang kiểm tra…");
  var done = false;
  setTimeout(function () { if (!done) { done = true; render("không phản hồi"); } }, 3000);
  try {
    fetch("http://127.0.0.1:47811/ping").then(function (r) { return r.text(); })
      .then(function (t) { if (!done) { done = true; render(t === "ok" ? "hoạt động" : "không phản hồi"); } })
      .catch(function () { if (!done) { done = true; render("không phản hồi"); } });
  } catch (e) { done = true; render("không phản hồi"); }
}
function closeDiag() { mode = "dock"; $("diag").classList.remove("on"); }

// ---------- remote ----------
document.addEventListener("keydown", function (ev) {
  var k = ev.keyCode;
  // on a computer keyboard: R, G, Y, B act as the red, green, yellow, blue buttons
  if (mode === "city") {
    if (k === 13 || k === 65376) { endCityEdit(true); ev.preventDefault(); }
    else if (k === 27 || k === 10009 || k === 65385) { endCityEdit(false); ev.preventDefault(); }
    return; // let the keyboard type
  }
  var COLOR_KEYS = { 82: 403, 71: 404, 89: 405, 66: 406 };
  if (COLOR_KEYS[k]) k = COLOR_KEYS[k];
  if (mode === "diag") {
    if (k === 404 || k === 10009 || k === 8 || k === 27 || k === 13) { closeDiag(); ev.preventDefault(); }
    return;
  }
  if (mode === "forecast") {
    if (k === 10009 || k === 8 || k === 27 || k === 13 || k === 38) { closeForecast(); ev.preventDefault(); }
    return;
  }
  if (mode === "picker") {
    var cols = 5, max = allApps.length - 1;
    if (k === 403 || k === 10009 || k === 8 || k === 27) { closePicker(); ev.preventDefault(); return; }
    if (pzone === "opts") {
      if (k === 37) ofocus = 0;
      else if (k === 39) ofocus = 1;
      else if (k === 40) { pzone = "grid"; pfocus = ofocus === 0 ? 0 : Math.min(max, 2); }
      else if (k === 13 && ofocus === 0) setIconStyle(STYLES[(STYLES.indexOf(iconStyle) + 1) % STYLES.length]);
      else if (k === 13 && ofocus === 1) { startCityEdit(); ev.preventDefault(); return; }
      else return;
    } else {
      if (k === 37) pfocus = Math.max(0, pfocus - 1);
      else if (k === 39) pfocus = Math.min(max, pfocus + 1);
      else if (k === 38) { if (pfocus < cols) { pzone = "opts"; ofocus = (pfocus % cols) < 2 ? 0 : 1; } else pfocus -= cols; }
      else if (k === 40) pfocus = Math.min(max, pfocus + cols);
      else if (k === 13) { togglePick(pfocus); ev.preventDefault(); return; }
      else if (k === 405) setIconStyle(STYLES[(STYLES.indexOf(iconStyle) + 1) % STYLES.length]);
      else return;
    }
    renderPicker(); ev.preventDefault(); return;
  }
  if (topFocus) {
    if (k === 13) { openForecast(); ev.preventDefault(); return; }
    if (k === 40 || k === 10009 || k === 8 || k === 27) { setTopFocus(false); ev.preventDefault(); return; }
    ev.preventDefault(); return;
  }
  if (k === 38) { setTopFocus(true); ev.preventDefault(); return; }
  if (k === 37) setFocus(focus - 1);
  else if (k === 39) setFocus(focus + 1);
  else if (k === 13) launch(items[focus]);
  else if (k === 403) openPicker();
  else if (k === 404) openDiag();
  else if (k === 405 && focus > 0 && !items[focus].add) {
    var t = pinned[focus]; pinned[focus] = pinned[focus - 1]; pinned[focus - 1] = t; focus--; savePinned(); buildDock();
  } else if (k === 406 && focus < pinned.length - 1) {
    var u = pinned[focus]; pinned[focus] = pinned[focus + 1]; pinned[focus + 1] = u; focus++; savePinned(); buildDock();
  } else return;
  ev.preventDefault();
});

// ---------- clock, weather ----------
function tick() {
  var d = new Date();
  $("clock").textContent = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  var city = $("date").getAttribute("data-city"), txt;
  try { txt = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"][d.getDay()] + ", " + d.getDate() + " tháng " + (d.getMonth() + 1); }
  catch (e) { txt = d.toDateString(); }
  $("date").textContent = txt + (city ? " · " + city : "");
}
var ICONS = {
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="#ffd60a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  cloud: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 18z"/></svg>',
  rain: '<svg viewBox="0 0 24 24" fill="none" stroke="#9cd2ff" stroke-width="2" stroke-linecap="round"><path stroke="#fff" d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>',
  snow: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
  storm: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.3 3.3 0 0 0 7 15z"/><path stroke="#ffd60a" d="M13 14l-3 4h4l-3 4"/></svg>'
};
function iconFor(code) {
  if (code === 0 || code === 1) return ICONS.sun;
  if (code >= 95) return ICONS.storm;
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ICONS.snow;
  if (code >= 51) return ICONS.rain;
  return ICONS.cloud;
}
var currentCity = null;
function findLocation(cb) {
  var chosen = savedCity();
  if (chosen) { cb(chosen); return; }
  if (FIXED_CITY) { cb(FIXED_CITY); return; }
  try {
    var c = JSON.parse(localStorage.getItem("hvn.loc") || "null");
    if (c && Date.now() - c.t < 24 * 3600 * 1000) { cb(c); return; }
  } catch (e) {}
  function save(loc) { loc.t = Date.now(); try { localStorage.setItem("hvn.loc", JSON.stringify(loc)); } catch (e) {} cb(loc); }
  fetch("https://get.geojs.io/v1/ip/geo.json").then(function (r) { return r.json(); }).then(function (j) {
    if (!j.latitude) throw 0; save({ name: j.city, lat: +j.latitude, lon: +j.longitude });
  }).catch(function () {
    fetch("https://ipapi.co/json/").then(function (r) { return r.json(); }).then(function (j) {
      if (!j.latitude) throw 0; save({ name: j.city, lat: j.latitude, lon: j.longitude });
    }).catch(function () { cb(FALLBACK_CITY); });
  });
}
var WX_TEXT = {
  0: "Trời quang", 1: "Ít mây", 2: "Mây rải rác", 3: "Nhiều mây",
  45: "Sương mù", 48: "Sương mù", 51: "Mưa phùn", 53: "Mưa phùn", 55: "Mưa phùn",
  61: "Mưa", 63: "Mưa", 65: "Mưa to", 66: "Mưa băng", 67: "Mưa băng",
  71: "Tuyết", 73: "Tuyết", 75: "Tuyết dày", 77: "Mưa tuyết",
  80: "Mưa rào", 81: "Mưa rào", 82: "Mưa rào to", 85: "Mưa tuyết", 86: "Mưa tuyết",
  95: "Dông", 96: "Dông kèm mưa đá", 99: "Dông kèm mưa đá"
};
function wxText(code) { return WX_TEXT[code] || ""; }
var weatherDaily = null;
function loadWeather() { findLocation(function (city) {
  currentCity = city;
  if (mode === "picker") renderPicker();
  var url = "https://api.open-meteo.com/v1/forecast?latitude=" + city.lat + "&longitude=" + city.lon +
    "&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=5&timezone=auto";
  fetch(url).then(function (r) { return r.json(); }).then(function (j) {
    var c = j.current; if (!c) return;
    $("weather").innerHTML = iconFor(c.weather_code) + "<span>" + Math.round(c.temperature_2m) + "°</span>";
    $("date").setAttribute("data-city", city.name || "");
    weatherDaily = j.daily || null;
    tick();
    if (mode === "forecast") renderForecast();
  }).catch(function () {});
}); }
function openForecast() {
  mode = "forecast";
  $("wxcue").classList.remove("on");
  $("top").classList.remove("sel");
  $("forecast").classList.add("on");
  renderForecast();
}
function closeForecast() { mode = "dock"; $("forecast").classList.remove("on"); setTopFocus(false); }
function setTopFocus(on) {
  topFocus = on;
  $("top").classList.toggle("sel", on);
  $("wxcue").classList.toggle("on", on);
}
function renderForecast() {
  var box = $("forecast");
  var title = currentCity && currentCity.name ? currentCity.name : "Thời tiết";
  if (!weatherDaily || !weatherDaily.time) {
    box.innerHTML = '<h1>' + title + '</h1><p class="sub">Đang tải dự báo…</p>';
    return;
  }
  var days = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];
  var html = '<h1>' + title + '</h1><p class="sub">Những ngày tới</p><div id="fdays">';
  for (var i = 0; i < weatherDaily.time.length; i++) {
    var d = new Date(weatherDaily.time[i] + "T12:00:00");
    var name = i === 0 ? "Hôm nay" : days[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth() + 1);
    html += '<div class="fday' + (i === 0 ? " today" : "") + '">' +
      '<div class="dname">' + name + '</div>' +
      iconFor(weatherDaily.weather_code[i]) +
      '<div class="hi">' + Math.round(weatherDaily.temperature_2m_max[i]) + '°</div>' +
      '<div class="lo">' + Math.round(weatherDaily.temperature_2m_min[i]) + '°</div>' +
      '<div class="desc">' + wxText(weatherDaily.weather_code[i]) + '</div></div>';
  }
  html += '</div><p class="sub" style="margin-top:40px">Back hoặc OK để đóng</p>';
  box.innerHTML = html;
}

// ---------- background photos ----------
var PHOTOS = ["01","02","03","04","05","06","07","08","09","10"].map(function (n) { return "photos/" + n + ".jpg"; });
var photoIdx = Math.floor(Math.random() * PHOTOS.length), photoFails = 0;
function nextPhoto() {
  var next = $("bg" + (1 - bgFlip)), cur = $("bg" + bgFlip);
  var url = PHOTOS[photoIdx % PHOTOS.length];
  photoIdx++;
  next.onload = function () {
    photoFails = 0;
    next.classList.remove("zoom"); void next.offsetWidth; next.classList.add("zoom");
    next.classList.add("on"); cur.classList.remove("on");
    bgFlip = 1 - bgFlip;
  };
  next.onerror = function () { photoFails++; if (photoFails < PHOTOS.length) nextPhoto(); };
  next.src = url;
}

// ---------- try your own icon images (on a computer) ----------
// Drop or paste an image of an app icon to see how it will look on the home screen.
var dropCount = 0;
function addTestIcon(file) {
  if (!file || !/^image\//.test(file.type)) return;
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () {
    dropCount++;
    var id = "test-" + dropCount + "-" + Date.now();
    var name = file.name && !/^image\.(png|jpe?g)$/i.test(file.name) ? file.name.replace(/\.[^.]+$/, "") : "Thử " + dropCount;
    allApps.push({ id: id, name: name, test: true });
    iconState[id] = { status: "ok", img: img, url: url, via: "thử", proc: {} };
    pinned.unshift(id);
    focus = 0; scrollX = 0;
    buildDock();
    toast("Đã thêm: " + name);
  };
  img.onerror = function () { toast("Không đọc được ảnh"); };
  img.src = url;
}
document.addEventListener("dragover", function (e) { e.preventDefault(); });
document.addEventListener("drop", function (e) {
  e.preventDefault();
  var files = e.dataTransfer && e.dataTransfer.files;
  for (var i = 0; files && i < files.length; i++) addTestIcon(files[i]);
});
document.addEventListener("paste", function (e) {
  if (mode === "city") return;
  var list = e.clipboardData && e.clipboardData.items;
  for (var i = 0; list && i < list.length; i++) {
    if (list[i].kind === "file") addTestIcon(list[i].getAsFile());
  }
});

// ---------- start ----------
tick(); setInterval(tick, 10000);
loadWeather(); setInterval(loadWeather, 30 * 60 * 1000);
nextPhoto(); setInterval(nextPhoto, PHOTO_SECONDS * 1000);
loadApps(function (list) {
  allApps = list;
  pinned = loadPinned().filter(function (id) { return appById(id); });
  buildDock();
  if (!allApps.length) toast("Không tìm thấy ứng dụng");
});
</script>
